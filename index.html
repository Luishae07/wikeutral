<header><a class=logo href="/">Wik<span>eutral</span></a>
<form class=s action="/search"><input name=q value="" placeholder="Search Wikeutral"><button>Search</button></form>
<a href="/random">Random</a><a href="/docs">API</a><a href="/news">News</a><a href="/download">Download</a><a href="/recent">Recent changes</a></header><main id="m"><p>Loading…</p></main>
<script>
const ADDR='https://raw.githubusercontent.com/Luishae07/groundcheck/HEAD/wikeutral-url.txt';
let SERVER='';
const m=document.getElementById('m');
async function findServer(){
  try{const r=await fetch(ADDR+'?'+Date.now(),{cache:'no-store'});const u=(await r.text()).trim().split('\n')[0];
      if(/^https:\/\//.test(u)){try{localStorage.setItem('wk',u)}catch(e){}return u}}catch(e){}
  try{return localStorage.getItem('wk')||''}catch(e){return ''}
}
// everything stays on this site and is copied from the tunnel, except files to download or play
const LEAVE=/^\/(?:image\/|api\/|file\/|json\/|xml\/|audio\/|mp3\/|download\/wikeutral)/;
function fixLinks(root){
  root.querySelectorAll('a[href^="/"]').forEach(a=>{const p=a.getAttribute('href');
    if(LEAVE.test(p)) a.setAttribute('href',SERVER+p); else a.setAttribute('href','#'+p);});
  root.querySelectorAll('[src^="/"]').forEach(e=>e.setAttribute('src',SERVER+e.getAttribute('src')));
  root.querySelectorAll('form').forEach(f=>{f.onsubmit=ev=>{ev.preventDefault();
    const a=(f.getAttribute('action')||'/'),q=new URLSearchParams(new FormData(f)).toString();
    location.hash='#'+a+(q?'?'+q:'')}});
}
async function load(){
  window.scrollTo(0,0);
  const path=location.hash.replace(/^#/,'')||'/';
  try{
    if(!SERVER)SERVER=await findServer();
    if(!SERVER)throw new Error('no address');
    const r=await fetch(SERVER+path,{redirect:'follow'});
    if(!r.ok&&r.status!==404)throw new Error('HTTP '+r.status);
    const doc=new DOMParser().parseFromString(await r.text(),'text/html');
    const main=doc.querySelector('main');
    document.title=doc.title||'Wikeutral';
    m.innerHTML=main?main.innerHTML:'<p>Nothing here.</p>';
    fixLinks(m);
    if(r.redirected){const u=new URL(r.url);history.replaceState(null,'','#'+u.pathname+u.search)}
  }catch(e){
    SERVER=await findServer();
    m.innerHTML='<h1>Wikeutral</h1><p>The wiki is not answering right now. It runs on a home server behind a tunnel; try again in a minute.</p>';
  }
}
fixLinks(document.querySelector('header'));
addEventListener('hashchange',load);
findServer().then(u=>{SERVER=u;fixLinks(document.querySelector('header'));load()});
</script>
